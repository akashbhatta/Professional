{% extends "home/base.html" %}

{% block content %}
<h1>Delete User</h1>
<p>Are you sure you want to delete this user?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'user-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
