<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .signup-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .textbox {
            margin-bottom: 20px;
            text-align: left;
        }

        .textbox label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        .textbox input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            color: #333;
        }

        .textbox input:focus {
            outline: none;
            border-color: #007bff;
        }

        .textbox small {
            display: block;
            color: red;
            margin-top: 5px;
        }

        .signup-btn button {
            width: 100%;
            padding: 15px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .signup-btn button:hover {
            background-color: #0056b3;
        }

        .login-link {
            margin-top: 15px;
        }

        .login-link a {
            color: #007bff;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            margin-bottom: 15px;
        }

        .success-message {
            color: green;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .signup-box {
                padding: 30px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <div class="signup-box">
            <h2>Sign Up</h2>

            {% if messages %}
            {% for message in messages %}
            <p class="{% if message.tags == 'success' %}success-message{% else %}error-message{% endif %}">{{ message }}
            </p>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="textbox">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <small>{{ field.errors|striptags }}</small>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="signup-btn">
                    <button type="submit">Sign Up</button>
                </div>
                <div class="login-link">
                    <p>Already have an account? <a href="{% url 'home:login' %}">Log in</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
